<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>101 причина любить тебя</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { min-height: 100%; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #f4f5f7;
    padding: 24px;

    background-image:
      linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.8)),
      url("assets/Глазки.png");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    background-color: #0a0c19;
  }

  h1 {
    text-align: center;
    margin-bottom: 24px;
    font-size: 1.6rem;
    color: #fff;
    text-shadow: 0 2px 12px rgba(0,0,0,.6);
  }

  /* ================= Сетка ================= */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 16px;
    max-width: 1200px;
    margin: 0 auto;
    perspective: 1000px;
  }

  .card {
    position: relative;
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    aspect-ratio: 4 / 5;
    background: rgba(255, 255, 255, .03);   /* было .08 — теперь почти невидимо */
    border: 1px solid rgba(255, 255, 255, .12); /* было .18 */
    backdrop-filter: blur(2px);              /* было 3px */
    -webkit-backdrop-filter: blur(2px);
    box-shadow: 0 2px 10px rgba(0,0,0,.18);  /* было .25 */
    transform-origin: center center;
    will-change: transform;
    z-index: 1;
    transition:
      transform .25s cubic-bezier(.2,.7,.3,1),
      box-shadow .25s ease,
      background .25s ease;
  }

  .card.is-hover {
    z-index: 50;
    background: rgba(255, 255, 255, .10);   /* было .14 */
    box-shadow: 0 30px 70px rgba(0,0,0,.55);
  }

  .card__img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
    opacity: .35;                            /* было .55 — фото бледнее */
    transition: opacity .25s ease, filter .25s ease;
  }

  .card.is-hover .card__img {
    opacity: .85;                            /* было .95 — фото проявляется */
    filter: brightness(1.05);
  }

  .card__overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(
      to bottom,
      rgba(0,0,0,.05) 0%,                   /* было .15 */
      rgba(0,0,0,.20) 100%                  /* было .35 */
    );
  }

  .card__body {
    position: absolute;
    inset: 0;
    padding: 14px;
    pointer-events: none;
    transform: translateZ(20px);
  }

  .card__num {
    position: absolute;
    top: 10px;
    left: 12px;
    font-size: .65rem;
    font-weight: 700;
    letter-spacing: .6px;
    text-transform: uppercase;
    color: rgba(255,255,255,.9);
    text-shadow: 0 1px 4px rgba(0,0,0,.9);
    z-index: 2;
  }

  .card__title {
    position: absolute;
    inset: 0;
    padding: 32px 14px 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 1rem;
    font-weight: 800;
    line-height: 1.25;
    color: #fff;
    text-shadow:
      0 1px 2px rgba(0,0,0,.9),
      0 2px 10px rgba(0,0,0,.7);
    letter-spacing: .2px;
  }

  .card__title span {
    display: -webkit-box;
    -webkit-line-clamp: 5;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card__glare {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    opacity: 0;
    transition: opacity .2s ease;
    mix-blend-mode: screen;
    background: radial-gradient(
      circle at var(--gx, 50%) var(--gy, 50%),
      rgba(255,255,255,.45) 0%,
      rgba(255,255,255,.1) 25%,
      rgba(255,255,255,0) 55%
    );
  }

  .card.is-hover .card__glare { opacity: 1; }

  /* ================= Модалка ================= */
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.78);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
    perspective: 1400px;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }

  .modal.open { display: flex; }

  .modal__content {
    position: relative;
    background: #111;
    border-radius: 18px;
    width: 100%;
    max-width: 560px;
    overflow: hidden;
    touch-action: pan-y;
    box-shadow: 0 30px 80px rgba(0,0,0,.6);
    transition: transform .35s cubic-bezier(.2,.7,.3,1);
    transform-style: preserve-3d;
    will-change: transform;
  }

  .modal.open .modal__content { animation: pop .25s ease; }

  @keyframes pop {
    from { opacity: 0; transform: scale(.9); }
    to   { opacity: 1; transform: scale(1); }
  }

  .modal__glare {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 4;
    opacity: 0;
    transition: opacity .25s ease;
    mix-blend-mode: screen;
    background: radial-gradient(
      circle at var(--gx, 50%) var(--gy, 50%),
      rgba(255,255,255,.35) 0%,
      rgba(255,255,255,.08) 25%,
      rgba(255,255,255,0) 55%
    );
  }

  .modal__content:hover .modal__glare { opacity: 1; }

  .modal__photo {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    background: #222;
  }

  .modal__img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .modal__photo::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(
      to top,
      rgba(0,0,0,.85) 0%,
      rgba(0,0,0,.25) 45%,
      rgba(0,0,0,0) 70%
    );
  }

  .modal__caption {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 22px;
    color: #fff;
    z-index: 2;
    transform: translateZ(30px);
  }

  .modal__num {
    font-size: .8rem;
    font-weight: 700;
    opacity: .85;
    letter-spacing: .6px;
    text-transform: uppercase;
  }

  .modal__title {
    font-size: 1.35rem;
    font-weight: 800;
    margin-top: 6px;
    line-height: 1.3;
  }

  .modal__text {
    font-size: .92rem;
    color: #e0e0e0;
    margin-top: 10px;
    line-height: 1.5;
  }

  .modal__close {
    position: absolute;
    top: 12px; right: 12px;
    z-index: 6;
    width: 40px; height: 40px;
    border: none;
    background: rgba(0,0,0,.55);
    color: #fff;
    border-radius: 50%;
    font-size: 1.2rem;
    cursor: pointer;
    backdrop-filter: blur(4px);
    transition: background .15s, transform .15s;
    transform: translateZ(40px);
  }

  .modal__close:hover {
    background: rgba(0,0,0,.85);
    transform: translateZ(40px) scale(1.08);
  }

  .modal__nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 18px;
    background: #1a1a1a;
    transform: translateZ(10px);
  }

  .nav-btn {
    border: none;
    background: #4f46e5;
    color: #fff;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: .9rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, opacity .15s;
    white-space: nowrap;
  }

  .nav-btn:hover:not(:disabled) { background: #4338ca; }
  .nav-btn:disabled { opacity: .35; cursor: default; }

  .modal__counter {
    font-size: .85rem;
    color: #bbb;
    font-weight: 600;
  }

  /* =========================================================
     ПРЕЛОАДЕРЫ И ЭКРАН ВХОДА
     ========================================================= */
  .screen {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 40%, #1a1030 0%, #0a0616 70%);
    transition: opacity .5s ease, visibility .5s ease;
  }

  .screen.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .screen__canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .preloader .screen__canvas {
    width: 220px;
    height: 220px;
    inset: auto;
    position: relative;
  }

  .preloader__label {
    position: absolute;
    bottom: 38%;
    left: 0; right: 0;
    text-align: center;
    color: #fff;
    font-size: .9rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: .8;
    animation: fadeInOut 1.8s ease-in-out infinite;
  }

  @keyframes fadeInOut {
    0%, 100% { opacity: .35; }
    50%      { opacity: .9; }
  }

  .login {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 360px;
    padding: 32px 26px 28px;
    border-radius: 20px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.15);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    display: flex;
    flex-direction: column;
    gap: 14px;
    animation: loginIn .5s cubic-bezier(.2,.7,.3,1);
  }

  @keyframes loginIn {
    from { opacity: 0; transform: translateY(20px) scale(.96); }
    to   { opacity: 1; transform: none; }
  }

  .login__title {
    font-size: 1.25rem;
    font-weight: 800;
    text-align: center;
    color: #fff;
    margin-bottom: 4px;
  }

  .login__subtitle {
    text-align: center;
    font-size: .82rem;
    color: rgba(255,255,255,.65);
    margin-bottom: 10px;
  }

  .login__field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .login__label {
    font-size: .75rem;
    color: rgba(255,255,255,.7);
    letter-spacing: .5px;
    text-transform: uppercase;
  }

  .login__input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,.18);
    background: rgba(0,0,0,.35);
    color: #fff;
    font-size: .95rem;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }

  .login__input:focus {
    border-color: #a855f7;
    box-shadow: 0 0 0 3px rgba(168,85,247,.25);
  }

  .login__btn {
    margin-top: 6px;
    padding: 13px 18px;
    border: none;
    border-radius: 10px;
    font-size: .95rem;
    font-weight: 700;
    color: #fff;
    cursor: pointer;
    background: linear-gradient(135deg, #ec4899, #a855f7);
    box-shadow: 0 8px 24px rgba(236,72,153,.35);
    transition: transform .12s, box-shadow .2s, opacity .2s;
  }

  .login__btn:hover { transform: translateY(-1px); box-shadow: 0 12px 28px rgba(236,72,153,.5); }
  .login__btn:active { transform: scale(.98); }
  .login__btn:disabled { opacity: .6; cursor: default; }

  .login__error {
    min-height: 18px;
    font-size: .8rem;
    color: #ff6b6b;
    text-align: center;
    opacity: 0;
    transition: opacity .2s;
  }

  .login__error.show { opacity: 1; }

  .main-content {
    opacity: 0;
    transition: opacity .6s ease;
  }
  .main-content.visible { opacity: 1; }

  /* Кнопка звука */
  .sound-toggle {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 900;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.25);
    background: rgba(0,0,0,.55);
    color: #fff;
    font-size: 1.2rem;
    cursor: pointer;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: background .2s, transform .15s, opacity .2s;
    display: none;
    align-items: center;
    justify-content: center;
  }

  .sound-toggle.visible { display: flex; }
  .sound-toggle:hover { background: rgba(0,0,0,.8); transform: scale(1.08); }
  .sound-toggle.muted { opacity: .6; }

  /* ================= Мобильная сетка ================= */
  @media (max-width: 640px) {
    body {
      padding: 10px;
      background-attachment: scroll;
      background-position: top center;
    }

    h1 { font-size: 1.1rem; margin-bottom: 14px; }

    .grid {
      grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
      gap: 6px;
    }

    .card {
      border-radius: 8px;
      background: rgba(255, 255, 255, .03);    /* было .07 */
      border: 1px solid rgba(255, 255, 255, .10); /* было .15 */
      backdrop-filter: blur(1.5px);
      -webkit-backdrop-filter: blur(1.5px);
      box-shadow: 0 1px 4px rgba(0,0,0,.2);
    }

    .card__img { opacity: .3; } 

    .card.is-hover {
      z-index: 1;
      background: rgba(255, 255, 255, .03);
      box-shadow: 0 1px 4px rgba(0,0,0,.2);
    }

    .card__body { padding: 6px; }

    .card__num {
      top: 4px;
      left: 5px;
      font-size: .42rem;
      letter-spacing: .3px;
      opacity: .9;
    }

    .card__title {
      padding: 14px 5px 5px;
      font-size: .55rem;
      line-height: 1.15;
      font-weight: 700;
    }

    .card__title span { -webkit-line-clamp: 4; }

    .card__overlay {
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,.04) 0%,                   /* было .10 */
        rgba(0,0,0,.18) 100%                  /* было .30 */
      );
    }

  @media (hover: none) {
    .card.is-hover { z-index: 1; }
  }

  @media (max-width: 768px) {
    body {
      background-attachment: scroll;
      background-position: top center;
    }
  }
</style>
</head>
<body>

<!-- Фоновая музыка -->
<audio id="bgMusic" loop preload="auto">
  <source src="assets/101prichina.mp3" type="audio/mpeg">
</audio>

<!-- Кнопка звука -->
<button class="sound-toggle" id="soundToggle" aria-label="Выключить звук" title="Выключить звук">🔊</button>

<!-- ===== 1. Стартовый прелоадер ===== -->
<div class="screen preloader" id="preloaderStart">
  <canvas class="screen__canvas" id="preCanvasStart"></canvas>
  <div class="preloader__label">Загрузка…</div>
</div>

<!-- ===== 2. Экран входа ===== -->
<div class="screen" id="loginScreen">
  <canvas class="screen__canvas" id="preCanvasLogin"></canvas>

  <form class="login" id="loginForm" autocomplete="off">
    <div class="login__title">Вход</div>
    <div class="login__subtitle">Введите логин и пароль</div>

    <div class="login__field">
      <label class="login__label" for="loginUser">Логин</label>
      <input class="login__input" id="loginUser" type="text" placeholder="Ваш логин" required>
    </div>

    <div class="login__field">
      <label class="login__label" for="loginPass">Пароль</label>
      <input class="login__input" id="loginPass" type="password" placeholder="Пароль" required>
    </div>

    <div class="login__error" id="loginError"></div>

    <button class="login__btn" type="submit">Войти</button>
  </form>
</div>

<!-- ===== 3. Прелоадер после входа ===== -->
<div class="screen preloader hidden" id="preloaderAfter">
  <canvas class="screen__canvas" id="preCanvasAfter"></canvas>
  <div class="preloader__label">Очень сильна тебя люблююю, Утя</div>
</div>

<!-- ===== 4. Главный контент ===== -->
<main class="main-content" id="mainContent">
  <h1>101 причина любить тебя ❤️</h1>
  <div class="grid" id="grid"></div>
</main>

<!-- ===== Модальное окно ===== -->
<div class="modal" id="modal">
  <div class="modal__content" id="modalContent">
    <div class="modal__glare" id="modalGlare"></div>
    <button class="modal__close" id="closeBtn" aria-label="Закрыть">✕</button>

    <div class="modal__photo">
      <img class="modal__img" id="modalImg" alt="">
      <div class="modal__caption">
        <div class="modal__num" id="modalNum"></div>
        <div class="modal__title" id="modalTitle"></div>
        <div class="modal__text" id="modalText"></div>
      </div>
    </div>

    <div class="modal__nav">
      <button class="nav-btn" id="prevBtn">← Назад</button>
      <span class="modal__counter" id="modalCounter"></span>
      <button class="nav-btn" id="nextBtn">Вперёд →</button>
    </div>
  </div>
</div>

/* =========================================================
   ЛОГИКА КАРТОЧЕК И МОДАЛКИ
   ========================================================= */
const TOTAL = DATA.length;
let currentIndex = 0;

const grid         = document.getElementById('grid');
const modal        = document.getElementById('modal');
const modalContent = document.getElementById('modalContent');
const modalGlare   = document.getElementById('modalGlare');
const modalImg     = document.getElementById('modalImg');
const modalNum     = document.getElementById('modalNum');
const modalTitle   = document.getElementById('modalTitle');
const modalText    = document.getElementById('modalText');
const modalCounter = document.getElementById('modalCounter');
const prevBtn      = document.getElementById('prevBtn');
const nextBtn      = document.getElementById('nextBtn');
const closeBtn     = document.getElementById('closeBtn');

function buildGrid() {
  const fragment = document.createDocumentFragment();
  DATA.forEach((d, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.index = i;
    card.innerHTML = `
      <img class="card__img" src="${d.img}" alt="${d.reason}" loading="lazy" decoding="async">
      <div class="card__overlay"></div>
      <div class="card__glare"></div>
      <div class="card__body">
        <div class="card__num">Причина №${i + 1}</div>
        <div class="card__title"><span>${d.reason}</span></div>
      </div>
    `;
    card.addEventListener('click', () => openModal(i));
    fragment.appendChild(card);
  });
  grid.appendChild(fragment);
}

/* ==== 3D-наклон карточек ==== */
const HOVER_SCALE = 2.0;
const TILT_CARD   = 12;

function bindCardTilt(card) {
  const glare = card.querySelector('.card__glare');

  card.addEventListener('mouseenter', () => {
    card.classList.add('is-hover');
    card.style.transition = 'transform .15s cubic-bezier(.2,.7,.3,1), box-shadow .25s ease';
  });

  card.addEventListener('mousemove', e => {
    const rect = card.getBoundingClientRect();
    const px = (e.clientX - rect.left) / rect.width;
    const py = (e.clientY - rect.top)  / rect.height;

    const rotateY = (0.5 - px) * TILT_CARD * 2;
    const rotateX = (py - 0.5) * TILT_CARD * 2;

    card.style.transform =
      `scale(${HOVER_SCALE}) rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg)`;

    glare.style.setProperty('--gx', (px * 100).toFixed(1) + '%');
    glare.style.setProperty('--gy', (py * 100).toFixed(1) + '%');
  });

  card.addEventListener('mouseleave', () => {
    card.classList.remove('is-hover');
    card.style.transition = 'transform .3s cubic-bezier(.2,.7,.3,1), box-shadow .25s ease';
    card.style.transform = 'scale(1) rotateX(0deg) rotateY(0deg)';
    glare.style.setProperty('--gx', '50%');
    glare.style.setProperty('--gy', '50%');
  });
}

/* ==== Модалка ==== */
function openModal(index) {
  currentIndex = index;
  renderModal();
  resetTilt();
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function renderModal() {
  const d = DATA[currentIndex];
  modalImg.src          = d.img;
  modalImg.alt          = d.reason;
  modalNum.textContent  = `Причина №${currentIndex + 1}`;
  modalTitle.textContent= d.reason;
  modalText.textContent = d.text;
  modalCounter.textContent = `${currentIndex + 1} / ${TOTAL}`;
  prevBtn.disabled = currentIndex === 0;
  nextBtn.disabled = currentIndex === TOTAL - 1;
}

function closeModal() {
  modal.classList.remove('open');
  document.body.style.overflow = '';
  resetTilt();
}

function next() { if (currentIndex < TOTAL - 1) { currentIndex++; renderModal(); } }
function prev() { if (currentIndex > 0)        { currentIndex--; renderModal(); } }

/* ==== 3D-наклон в модалке ==== */
const MAX_TILT = 14;

function resetTilt() {
  modalContent.style.transform = 'rotateX(0deg) rotateY(0deg)';
  modalGlare.style.setProperty('--gx', '50%');
  modalGlare.style.setProperty('--gy', '50%');
}

function handleModalTilt(e) {
  if (!modal.classList.contains('open')) return;
  const rect = modalContent.getBoundingClientRect();
  const px = (e.clientX - rect.left) / rect.width;
  const py = (e.clientY - rect.top)  / rect.height;
  if (px < -0.5 || px > 1.5 || py < -0.5 || py > 1.5) { resetTilt(); return; }

  const rotateY = (0.5 - px) * MAX_TILT * 2;
  const rotateX = (py - 0.5) * MAX_TILT * 2;
  modalContent.style.transform =
    `rotateX(${rotateX.toFixed(2)}deg) rotateY(${rotateY.toFixed(2)}deg)`;

  modalGlare.style.setProperty('--gx', (px * 100).toFixed(1) + '%');
  modalGlare.style.setProperty('--gy', (py * 100).toFixed(1) + '%');
}

document.addEventListener('mousemove', handleModalTilt);
document.addEventListener('mouseleave', resetTilt);

closeBtn.addEventListener('click', closeModal);
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
nextBtn.addEventListener('click', next);
prevBtn.addEventListener('click', prev);

document.addEventListener('keydown', e => {
  if (!modal.classList.contains('open')) return;
  if (e.key === 'Escape')     closeModal();
  if (e.key === 'ArrowRight') next();
  if (e.key === 'ArrowLeft')  prev();
});

let touchStartX = 0;
modalContent.addEventListener('touchstart', e => {
  touchStartX = e.changedTouches[0].clientX;
}, { passive: true });
modalContent.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) dx < 0 ? next() : prev();
}, { passive: true });

/* =========================================================
   АНИМИРОВАННОЕ СЕРДЦЕ ИЗ ЧАСТИЦ
   ========================================================= */
function createHeartField(canvas, options = {}) {
  const ctx = canvas.getContext('2d');
  const opts = Object.assign({
    count: 600,
    size: 1.8,
    hueBase: 330,
    speed: 1,
  }, options);

  let W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
  let particles = [];
  let t = 0;
  let rafId = null;

  function heartPoint(angle, scale) {
    const x = 16 * Math.pow(Math.sin(angle), 3);
    const y = -(13 * Math.cos(angle) - 5 * Math.cos(2 * angle)
            - 2 * Math.cos(3 * angle) - Math.cos(4 * angle));
    return { x: x * scale, y: y * scale };
  }

  function resize() {
    const rect = canvas.getBoundingClientRect();
    W = rect.width;
    H = rect.height;
    canvas.width  = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildParticles();
  }

  function buildParticles() {
    const scale = Math.min(W, H) / 42;
    particles = [];
    for (let i = 0; i < opts.count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const p = heartPoint(angle, scale);
      const jitter = (Math.random() - 0.5) * scale * 0.9;
      particles.push({
        bx: W / 2 + p.x + jitter,
        by: H / 2 + p.y + jitter * 0.6,
        phase: Math.random() * Math.PI * 2,
        amp: 2 + Math.random() * 5,
        speed: 0.6 + Math.random() * 0.9,
        size: opts.size * (0.6 + Math.random() * 0.8),
        hue: opts.hueBase + (Math.random() - 0.5) * 40,
      });
    }
  }

  function tick() {
    if (!W || !H) { rafId = requestAnimationFrame(tick); return; }

    ctx.clearRect(0, 0, W, H);

    const pulse = 1 + Math.sin(t * opts.speed * 1.6) * 0.035;
    const cx = W / 2, cy = H / 2;

    for (const p of particles) {
      let x = cx + (p.bx - cx) * pulse;
      let y = cy + (p.by - cy) * pulse;

      x += Math.cos(t * p.speed + p.phase) * p.amp;
      y += Math.sin(t * p.speed + p.phase) * p.amp;

      const alpha = 0.35 + Math.abs(Math.sin(t * p.speed + p.phase)) * 0.55;
      const hue   = p.hue + Math.sin(t * 0.7 + p.phase) * 12;

      ctx.beginPath();
      ctx.arc(x, y, p.size * 2.6, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${hue}, 85%, 65%, ${alpha * 0.14})`;
      ctx.fill();

      ctx.beginPath();
      ctx.arc(x, y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${hue}, 90%, 72%, ${alpha})`;
      ctx.fill();
    }

    t += 0.016;
    rafId = requestAnimationFrame(tick);
  }

  function start() {
    if (rafId) return;
    resize();
    window.addEventListener('resize', resize);
    tick();
  }

  function stop() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    window.removeEventListener('resize', resize);
  }

  return { start, stop };
}

/* =========================================================
   ЭКРАНЫ: прелоадер → логин → прелоадер → главная
   ========================================================= */

// ⚠️ НАСТРОЙКИ ВХОДА
const ALLOWED_LOGINS = ['Китя', 'Киса', 'Солнц', 'Солнце', 'Любимая', 'Котен', 'Принцесса', 'Самая Лучшаяho inTheWorld', 'Кис', 'Утя'];
const PASSWORD       = ["143", "228"];

const preStart   = document.getElementById('preloaderStart');
const preAfter   = document.getElementById('preloaderAfter');
const loginScr   = document.getElementById('loginScreen');
const mainScr    = document.getElementById('mainContent');
const loginForm  = document.getElementById('loginForm');
const loginUser  = document.getElementById('loginUser');
const loginPass  = document.getElementById('loginPass');
const loginErr   = document.getElementById('loginError');

const bgMusic     = document.getElementById('bgMusic');
const soundToggle = document.getElementById('soundToggle');

// Пока идёт стартовый прелоадер — блокируем скролл
document.body.style.overflow = 'hidden';

/* 1. Стартовый прелоадер */
const heartStart = createHeartField(document.getElementById('preCanvasStart'), {
  count: 350, size: 1.6
});
heartStart.start();

setTimeout(() => {
  heartStart.stop();
  preStart.classList.add('hidden');

  /* 2. Экран входа с сердцем на фоне */
  const heartLogin = createHeartField(document.getElementById('preCanvasLogin'), {
    count: 900, size: 1.8, speed: 1.1
  });
  heartLogin.start();
  loginScr.classList.remove('hidden');
  loginUser.focus();

  /* 3. Обработка формы */
  loginForm.addEventListener('submit', e => {
    e.preventDefault();
    loginErr.classList.remove('show');
    loginErr.textContent = '';

    const user = loginUser.value.trim().toLowerCase();
    const pass = loginPass.value;

    const userOk = ALLOWED_LOGINS.some(l => l.toLowerCase() === user);
    const passOk = PASSWORD.includes(pass);

    if (!userOk) {
      loginErr.textContent = 'Такого логина нет';
      loginErr.classList.add('show');
      return;
    }
    if (!passOk) {
      loginErr.textContent = '143 или 228 — вот правильный пароль';
      loginErr.classList.add('show');
      return;
    }

    // ===== УСПЕХ =====
    heartLogin.stop();
    loginScr.classList.add('hidden');

    // Запуск музыки (пользовательский жест = разрешено)
    bgMusic.volume = 0;
    bgMusic.play().then(() => {
      let v = 0;
      const fade = setInterval(() => {
        v += 0.025;
        if (v >= 0.5) { v = 0.5; clearInterval(fade); }
        bgMusic.volume = v;
      }, 100);
    }).catch(err => console.warn('Музыка:', err));

    // Показ кнопки звука
    soundToggle.classList.add('visible');
    soundToggle.textContent = '🔊';
    soundToggle.classList.remove('muted');
    soundToggle.onclick = () => {
      if (bgMusic.paused) {
        bgMusic.play();
        soundToggle.textContent = '🔊';
        soundToggle.classList.remove('muted');
      } else {
        bgMusic.pause();
        soundToggle.textContent = '🔇';
        soundToggle.classList.add('muted');
      }
    };

    /* 4. Прелоадер после входа */
    const heartAfter = createHeartField(document.getElementById('preCanvasAfter'), {
      count: 400, size: 1.7
    });
    preAfter.classList.remove('hidden');
    heartAfter.start();

    setTimeout(() => {
      heartAfter.stop();
      preAfter.classList.add('hidden');

      /* 5. Показываем главную */
      mainScr.classList.add('visible');
      document.body.style.overflow = '';
    }, 1600);
  });
}, 1800);

/* Esc на логине — скрыть ошибку */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !loginScr.classList.contains('hidden')) {
    loginErr.classList.remove('show');
  }
});

/* =========================================================
   ЗАПУСК СЕТКИ
   ========================================================= */
buildGrid();
document.querySelectorAll('.card').forEach(bindCardTilt);
</script>
